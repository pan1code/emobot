services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://emobot:emobot@database:5432/emobot
      ML_SERVICE_URL: http://ml-service:9000
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      ml-service:
        condition: service_started

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    ports:
      - "9000:9000"

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emobot
      POSTGRES_USER: emobot
      POSTGRES_PASSWORD: emobot
    volumes:
      - ./database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emobot -d emobot"]
      interval: 5s
      timeout: 5s
      retries: 10
